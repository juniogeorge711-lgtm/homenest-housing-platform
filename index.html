<html lang="en" class="scroll-smooth">

    <!-- Schema.org JSON-LD for Real Estate Rental Platform -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "HavenStone Living",
        "description": "Premium apartment and housing rental platform featuring verified luxury listings, instant viewing bookings, and smart leasing technology engineered by George.",

          "name": "George",
          "jobTitle": "Lead Software Developer & Technology Architect"
        },
        "currenciesAccepted": "USD",
        "openingHours": "Mo-Su 08:00-20:00"
      }
    </script>

  <body class="bg-[#FAF7F2] text-[#111111] antialiased selection:bg-[#8B5E3C] selection:text-white">
